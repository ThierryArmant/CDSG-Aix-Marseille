name: Recherche web

# Lancée depuis une fiche du site (bouton « Chercher en ligne ») ou à la main depuis l'onglet Actions.
on:
  # Veille automatique : chaque nuit vers 3 h, les 10 fiches vérifiées il y a le plus longtemps
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fiche:
        description: "Identifiant de la fiche (vide = plusieurs fiches selon le filtre)"
        default: ""
      liens:
        description: "Liens d'articles à lire en priorité (séparés par des espaces)"
        default: ""
      filtre:
        description: "Si pas de fiche : toutes / verifier / dormante / projet / active / palmares"
        default: "verifier"
      maximum:
        description: "Nombre maximum de fiches (0 = pas de limite)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: recherche
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Veille web
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          API_MODEL: ${{ vars.API_MODEL }}
          MODELE_TRI: ${{ vars.MODELE_TRI }}
          MODELE_EXTRACTION: ${{ vars.MODELE_EXTRACTION }}
          MODELE_SYNTHESE: ${{ vars.MODELE_SYNTHESE }}
          FICHE: ${{ inputs.fiche }}
          LIENS: ${{ inputs.liens }}
          FILTRE: ${{ inputs.filtre }}
          MAXI: ${{ inputs.maximum }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 recherche/recherche_web.py --palmares --rotation 10
          elif [ -n "$FICHE" ]; then
            python3 recherche/recherche_web.py --fiche "$FICHE" --liens "$LIENS"
          else
            OPT=""
            case "$FILTRE" in
              verifier) OPT="--verifier" ;;
              dormante|projet|active) OPT="--statut $FILTRE" ;;
              palmares) OPT="--palmares" ;;
            esac
            python3 recherche/recherche_web.py $OPT --max "${MAXI:-0}"
          fi
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/recherche.js data/actualites.js classes || true
          git diff --cached --quiet && exit 0
          git commit -m "Veille web : ${{ inputs.fiche || inputs.filtre || 'veille automatique' }}"
          git pull --rebase origin main && git push
