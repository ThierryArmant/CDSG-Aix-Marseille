name: Recherche web

# Lancement à la main depuis l'onglet « Actions » du dépôt.
on:
  workflow_dispatch:
    inputs:
      filtre:
        description: "Quelles fiches ? (toutes / verifier / dormante / projet / active)"
        default: "verifier"
      maximum:
        description: "Nombre maximum de fiches (0 = pas de limite)"
        default: "0"

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recherche et mise à jour des fiches
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
        run: |
          OPT=""
          case "${{ inputs.filtre }}" in
            verifier) OPT="--verifier" ;;
            dormante|projet|active) OPT="--statut ${{ inputs.filtre }}" ;;
          esac
          python3 recherche/recherche_web.py $OPT --max ${{ inputs.maximum }}
      - name: Enregistrer les résultats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/recherche.js
          git diff --cached --quiet || git commit -m "Recherche web : mise à jour des compléments"
          git push
