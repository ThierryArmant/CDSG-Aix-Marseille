name: Recherche web

# Lancée depuis le site (bouton « Chercher en ligne »), à la main (onglet Actions), ou chaque nuit.
# filtre « toutes » : les 89 fiches en parallèle (8 équipes), puis fusion des résultats.
on:
  schedule:
    - cron: "17 2 * * *"   # chaque nuit vers 3 h : 5 fiches vérifiées il y a le plus longtemps (+ palmarès le dimanche)
  workflow_dispatch:
    inputs:
      fiche:
        description: "Identifiant de la fiche (vide = plusieurs fiches selon le filtre)"
        default: ""
      liens:
        description: "Liens d'articles à lire en priorité (séparés par des espaces)"
        default: ""
      filtre:
        description: "Si pas de fiche : toutes / verifier / dormante / projet / active / palmares"
        default: "verifier"
      maximum:
        description: "Nombre maximum de fiches (0 = pas de limite)"
        default: "0"
      question:
        description: "Question posée depuis le site (recherche web + réponse)"
        default: ""
      qid:
        description: "Identifiant de la réponse"
        default: ""

permissions:
  contents: write

concurrency:
  # les questions passent à part : elles n'attendent pas les longues recherches et ne les annulent pas
  group: ${{ inputs.question != '' && format('question-{0}', inputs.qid) || 'recherche' }}
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  PYTHONUNBUFFERED: "1"

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tranche: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.filtre == 'toutes' && inputs.fiche == '') && '[0,1,2,3]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils PDF
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Compteur de départ
        run: cp data/quota.json /tmp/quota_depart.json 2>/dev/null || echo "{}" > /tmp/quota_depart.json
      - name: Veille web
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          MAX_REQUETES_FICHE: ${{ vars.MAX_REQUETES_FICHE }}
          API_MODEL: ${{ vars.API_MODEL }}
          MODELE_TRI: ${{ vars.MODELE_TRI }}
          MODELE_EXTRACTION: ${{ vars.MODELE_EXTRACTION }}
          MODELE_SYNTHESE: ${{ vars.MODELE_SYNTHESE }}
          MODELE_VISION: ${{ vars.MODELE_VISION }}
          FICHE: ${{ inputs.fiche }}
          LIENS: ${{ inputs.liens }}
          FILTRE: ${{ inputs.filtre }}
          MAXI: ${{ inputs.maximum }}
          TRANCHE: ${{ matrix.tranche }}
          QUESTION: ${{ inputs.question }}
          QID: ${{ inputs.qid }}
        run: |
          if [ -n "$QUESTION" ]; then
            python3 recherche/recherche_web.py --sans-boite --question-web "$QUESTION" --qid "$QID"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            PALM=""; [ "$(date +%u)" = "7" ] && PALM="--palmares"   # palmarès le dimanche
            python3 recherche/recherche_web.py $PALM --rotation 5
          elif [ -n "$FICHE" ]; then
            python3 recherche/recherche_web.py --fiche "$FICHE" --liens "$LIENS"
          elif [ "$FILTRE" = "toutes" ]; then
            BOITE=""; [ "$TRANCHE" != "0" ] && BOITE="--sans-boite"
            PALM=""; [ "$TRANCHE" = "0" ] && PALM="--palmares"
            python3 recherche/recherche_web.py $PALM $BOITE --statut active --tranche "$TRANCHE/4" || true
            python3 recherche/recherche_web.py --sans-boite --statut dormante --tranche "$TRANCHE/4" || true
            python3 recherche/recherche_web.py --sans-boite --statut projet --tranche "$TRANCHE/4" || true
          else
            OPT=""
            case "$FILTRE" in
              verifier) OPT="--verifier" ;;
              dormante|projet|active) OPT="--statut $FILTRE" ;;
              palmares) OPT="--palmares" ;;
            esac
            python3 recherche/recherche_web.py $OPT --max "${MAXI:-0}"
          fi
      - name: Mettre de côté les résultats
        if: always()
        run: |
          mkdir -p res
          [ -d classes ] && cp -r classes res/ || true
          [ -d data/reponses ] && cp -r data/reponses res/ || true
          cp data/recherche.js data/a_lire.json data/quota.json res/ 2>/dev/null || true
          cp /tmp/quota_depart.json res/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-${{ matrix.tranche }}
          path: res
          retention-days: 3

  enregistrer:
    needs: veille
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/resultats
      - name: Fusionner avec la version la plus récente et enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for essai in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for d in /tmp/resultats/*/; do python3 recherche/recherche_web.py --fusionner "$d"; done
            git add data/recherche.js data/actualites.js data/a_lire.json data/quota.json classes data/reponses 2>/dev/null || git add data/recherche.js data/actualites.js data/a_lire.json data/quota.json classes
            git diff --cached --quiet && exit 0
            git commit -q -m "${{ inputs.question != '' && 'Question web' || 'Veille web' }} : ${{ inputs.fiche || inputs.qid || inputs.filtre || 'veille automatique' }}"
            git push -q origin HEAD:main && exit 0
            sleep $((essai * 5))
          done
          exit 1
